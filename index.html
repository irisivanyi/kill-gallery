<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kill Gallery</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: #A17EE1;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    .wrap {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 32px;
    }

    .inner {
      display: flex;
      align-items: center;
      gap: 56px;
      max-width: 860px;
      width: 100%;
    }

    /* Logo */
    .logo {
      flex-shrink: 0;
      width: 280px;
    }

    .logo svg {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Centre column */
    .centre {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 36px;
    }

    .tagline {
      margin: 0;
      font-size: 1.35rem;
      line-height: 1.55;
      color: #2B0933;
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 400;
      max-width: 340px;
    }

    /* Subscribe form */
    #newsletter-form {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 240px;
    }

    #newsletter-form input[type="email"] {
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 0;
      padding: 8px 0;
      font-size: 0.8rem;
      color: white;
      width: 100%;
      outline: none;
      text-align: center;
      letter-spacing: 0.04em;
      font-family: inherit;
    }

    #newsletter-form input[type="email"]::placeholder {
      color: rgba(255, 255, 255, 0.55);
    }

    #newsletter-form button[type="submit"] {
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 0;
      padding: 3px 0;
      font-size: 0.625rem;
      color: rgba(255, 255, 255, 0.7);
      cursor: pointer;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-family: inherit;
      transition: color 0.2s, border-color 0.2s;
    }

    #newsletter-form button[type="submit"]:hover {
      color: rgba(255, 255, 255, 0.95);
      border-color: rgba(255, 255, 255, 0.75);
    }

    #form-msg {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.75);
      margin: 0;
      min-height: 1em;
    }

    .contact {
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      color: rgba(255, 255, 255, 0.5);
      margin: 0;
    }

    /* Mobile */
    @media (max-width: 600px) {
      .inner {
        flex-direction: column;
        gap: 40px;
        align-items: center;
      }

      .logo {
        width: 200px;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="inner">

      <!-- Logo -->
      <div class="logo">
        <svg viewBox="0 0 802 490" xmlns="http://www.w3.org/2000/svg" aria-label="Kill Gallery artwork">
          <path d="M364.4 128.1L440.957 260.7H287.843L364.4 128.1Z" fill="#822E77"/>
          <path d="M454.622 155L515.868 261.08H393.377L454.622 155Z" fill="#822E77"/>
          <circle cx="454.902" cy="98" r="32" fill="#822E77"/>
          <path d="M187.5 416.5H70.5L70 249.5L112.5 203.5L166 224L204.5 257.5L244 349L298 333L319 376.5L230 416.5H211L130 288L125 326L187.5 416.5Z" fill="#822E77"/>
          <path d="M240 162.5L221 163.5C221 203.5 200 213 181 207L139 192.5C126 186.5 99 174.6 99 129C99 83.4 140.333 70.3333 161 69.5C225 69.5 237 148 240 162.5Z" fill="#822E77"/>
          <path d="M337 368L314 326.5L344 301.5H399V318H361V332H399L359.5 360.5L337 368Z" fill="#822E77"/>
          <path d="M614.5 416.5H731.5L732 249.5L689.5 203.5L636 224L597.5 257.5L558 349L504 333L483 376.5L572 416.5H591L672 288L677 326L614.5 416.5Z" fill="#822E77"/>
          <path d="M562 162.5L581 163.5C581 203.5 602 213 621 207L663 192.5C676 186.5 703 174.6 703 129C703 83.4 661.667 70.3333 641 69.5C577 69.5 565 148 562 162.5Z" fill="#822E77"/>
          <path d="M465 368L488 326.5L458 301.5H403V318H441V332H403L442.5 360.5L465 368Z" fill="#822E77"/>
        </svg>
      </div>

      <!-- Centre: text + contact + subscribe -->
      <div class="centre">
        <p class="tagline">A curatorial agency focused on bringing ambitious art to life in new worlds.</p>

        <p class="contact">contact: killgallery@killgallery.com</p>

        <form id="newsletter-form" action="https://formbold.com/s/9xljk" method="POST">
          <input type="email" name="email" placeholder="your email" required aria-label="Email">
          <input type="hidden" name="source" value="killgallery.com">
          <input type="text" name="website" tabindex="-1" autocomplete="off" style="display:none">
          <button type="submit">Subscribe</button>
          <p id="form-msg" role="status"></p>
        </form>
      </div>

    </div>
  </main>

  <script>
    const form = document.getElementById('newsletter-form');
    const msg  = document.getElementById('form-msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = new FormData(form);
      try {
        const res = await fetch(form.action, { method: 'POST', body: data });
        if (res.ok) {
          msg.textContent = 'You\'re on the list.';
          form.reset();
        } else {
          msg.textContent = 'Something went wrong — try again.';
        }
      } catch {
        msg.textContent = 'Something went wrong — try again.';
      }
    });
  </script>
</body>
</html>
